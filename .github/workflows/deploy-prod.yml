name: Deploy - prod

# Scaffold only - see deploy-staging.yml. Add required reviewers on
# the "prod" GitHub Environment so this always needs a human approval.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: prod
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
