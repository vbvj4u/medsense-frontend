name: Deploy - staging

# Scaffold only - see medsense-infra's terraform-staging.yml. Wire up
# a "staging" GitHub Environment with real secrets once that AWS
# account/environment exists.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      environment: staging
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
